blueprint:
  name: Alexa voice phrase to action
  description: >-
    Match literal Alexa Voice Events phrases and run your HA actions.
    Reception off, revoked sessions and stale queued events are rejected.
  domain: automation
  source_url: https://github.com/vincent97277/ha-alexa-voice-events/blob/main/blueprints/automation/alexa_voice_events/phrase_to_action.yaml
  homeassistant:
    min_version: "2026.10.2"
  input:
    voice_entities:
      name: Speakers' voice event entities
      selector:
        entity:
          filter:
            - integration: alexa_voice_events
              domain: event
          multiple: true
    phrases:
      name: Recognized phrases
      description: >-
        One literal phrase per line. Case and repeated whitespace are ignored.
        Include the wake-word prefix if it appears in the recognized text.
        Prefer a clear phrase with context over an ambiguous single word; verify
        the actual voice_command before adding variants. This does not train Alexa.
      selector:
        text:
          multiline: true
    interrupt_native_reply:
      name: Attempt to interrupt the native reply
      description: >-
        Best effort; may stop music too. A successful action is not confirmation
        that Alexa stopped talking or ended follow-up questions.
      default: true
      selector:
        boolean: {}
    reply_sensors:
      name: Sensors to report
      description: >-
        Optional. Select sensors to build a reply without writing a template.
        Uses Home Assistant's recorded values after your actions.
      default: []
      selector:
        entity:
          filter:
            - domain: sensor
          multiple: true
    reply_message:
      name: Reply message
      description: >-
        Optional text or template, evaluated after your actions. Overrides the sensor
        report. Leave blank to report selected sensors, or select no sensors for silence.
      default: ""
      selector:
        template: {}
    actions:
      name: Actions
      default: []
      selector:
        action: {}
mode: queued
max: 10
max_exceeded: silent
variables:
  configured_phrases: !input phrases
  interrupt_native_reply: !input interrupt_native_reply
  reply_sensors: !input reply_sensors
triggers:
  - trigger: state
    entity_id: !input voice_entities
conditions:
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none and trigger.to_state is not none
         and trigger.to_state.attributes.get('event_type') == 'voice_received'
         and trigger.to_state.attributes.get('schema_version') == 1
         and trigger.to_state.attributes.get('event_id')
             != trigger.from_state.attributes.get('event_id') }}
actions:
  - variables:
      envelope: "{{ dict(trigger.to_state.attributes) }}"
  - condition: template
    value_template: >-
      {% set text = envelope.get('voice_command', '') | trim | lower | regex_replace('\\s+', ' ') %}
      {% set phrases = configured_phrases.split('\n') | map('trim') | map('lower')
          | map('regex_replace', '\\s+', ' ') | reject('eq', '') | list %}
      {{ text in phrases }}
  - &voice_guard
    alias: Record current voice authorization reason
    variables:
      voice_guard_reason: >-
        {% set source_ms = envelope.get('source_timestamp_ms') %}
        {% set received_ms = as_timestamp(envelope.get('received_at'), 0) * 1000 %}
        {% set now_ms = as_timestamp(now()) * 1000 %}
        {% set reception = envelope.get('reception_entity_id', '') %}
        {% if not envelope.get('device_id') or not envelope.get('event_id')
              or device_id(trigger.entity_id) != envelope.get('device_id')
              or state_attr(trigger.entity_id, 'device_id') != envelope.get('device_id')
              or device_id(reception) != envelope.get('device_id') %}
          source_mismatch
        {% elif state_attr(trigger.entity_id, 'event_id') != envelope.get('event_id') %}
          event_superseded
        {% elif not is_state(reception, 'on') %}
          reception_disabled
        {% elif not envelope.get('session_id')
              or state_attr(reception, 'session_id') != envelope.get('session_id') %}
          session_revoked
        {% elif source_ms is not integer or received_ms <= 0 %}
          invalid_timestamp
        {% elif now_ms < source_ms or now_ms < received_ms %}
          future_timestamp
        {% elif now_ms - source_ms >= 15000 or now_ms - received_ms >= 15000 %}
          event_expired
        {% else %}
          ready
        {% endif %}
  - &current_voice
    alias: Reject superseded, revoked or expired voice work
    condition: template
    value_template: "{{ voice_guard_reason == 'ready' }}"
  - &resolve_targets
    alias: Resolve current official targets (read-only)
    action: alexa_voice_events.resolve_targets
    data: >-
      {{ dict(source_entity_id=trigger.entity_id) }}
    response_variable: targets
  - &source_binding
    alias: Source binding is not permission to bypass voice checks
    condition: template
    value_template: >-
      {{ targets.source_valid and targets.source_device_id == envelope.get('device_id') }}
  - *voice_guard
  - *current_voice
  - if:
      - condition: template
        value_template: "{{ interrupt_native_reply and targets.stop.entity_id is not none }}"
    then:
      - *voice_guard
      - *current_voice
      - alias: Attempt native reply interruption (delivery unknown)
        action: media_player.media_stop
        target:
          entity_id: "{{ targets.stop.entity_id }}"
        continue_on_error: true
  - *resolve_targets
  - *source_binding
  - *voice_guard
  - *current_voice
  - sequence: !input actions
  - *voice_guard
  - *current_voice
  - *resolve_targets
  - *source_binding
  - *voice_guard
  - *current_voice
  - alias: Render optional reply using data after household actions
    variables:
      custom_reply: !input reply_message
  - variables:
      rendered_reply: >-
        {% if custom_reply is none or (custom_reply is string and not custom_reply | trim) %}
          {% set report = namespace(parts=[]) %}
          {% for entity in reply_sensors %}
            {% set name = state_attr(entity, 'friendly_name') or entity %}
            {% set value = states(entity) %}
            {% set unit = state_attr(entity, 'unit_of_measurement') %}
            {% set numeric = unit or state_attr(entity, 'state_class')
                in ['measurement', 'total', 'total_increasing'] %}
            {% if not has_value(entity) or (numeric and not is_number(value))
                  or ((value | float(none)) is not none and not is_number(value)) %}
              {% set report.parts = report.parts + [name ~ ' is unavailable'] %}
            {% else %}
              {% set report.parts = report.parts + [name ~ ' is ' ~ value ~ (' ' ~ unit if unit else '')] %}
            {% endif %}
          {% endfor %}
          {{ 'Home Assistant reports: ' ~ report.parts | join('; ') ~ '.' if report.parts else '' }}
        {% else %}
          {{ custom_reply }}
        {% endif %}
  - *voice_guard
  - *current_voice
  - alias: Explain reply disposition without inventing a delivery receipt
    variables:
      reply_target: "{{ targets.speak }}"
      reply_reason: >-
        {% if rendered_reply is none or (rendered_reply is string and not rendered_reply | trim) %}
          empty_reply
        {% elif not (rendered_reply is string or (rendered_reply is number
                     and rendered_reply is not boolean and is_number(rendered_reply))) %}
          invalid_reply_format
        {% elif reply_target.entity_id is none %}
          {{ reply_target.reason }}
        {% else %}
          ready
        {% endif %}
  - if:
      - condition: template
        value_template: "{{ reply_reason == 'ready' }}"
    then:
      - *voice_guard
      - *current_voice
      - alias: Request optional reply (delivery and playback completion unknown)
        action: notify.send_message
        target:
          entity_id: "{{ reply_target.entity_id }}"
        data:
          message: "{{ rendered_reply | string }}"
        continue_on_error: true
