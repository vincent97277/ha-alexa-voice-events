[project]
name = "ha-alexa-voice-events"
version = "0.1.0"
description = "Generic Alexa voice events for Home Assistant"
requires-python = ">=3.14.2,<3.15"
license = "Apache-2.0"

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component==0.13.373",
  "aioamazondevices==16.3.2",
  "mypy",
  "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --disable-socket --allow-unix-socket"
timeout = 15

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
files = ["custom_components/alexa_voice_events"]
check_untyped_defs = true
disallow_untyped_defs = true
follow_imports = "silent"
ignore_missing_imports = true

